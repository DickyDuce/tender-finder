name: Warm notice cache

# Pre-reads tender notices for the sample profiles and publishes the results on the `cache`
# branch, so the web app starts warm instead of reading ~25 PDFs on a visitor's first search.
# Sends no messages. Needs the GROQ_API_KEY Actions secret; without it the job skips cleanly.

on:
  schedule:
    - cron: "30 2 * * *"   # 05:30 East Africa Time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: warm-cache
  cancel-in-progress: false

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check for API key
        id: key
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "::notice::GROQ_API_KEY secret not set: skipping cache warm-up."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.key.outputs.ok == 'true'

      - uses: actions/setup-python@v5
        if: steps.key.outputs.ok == 'true'
        with:
          python-version: "3.13"
          cache: pip

      - if: steps.key.outputs.ok == 'true'
        run: pip install -r requirements.txt

      - name: Restore previous extractions
        if: steps.key.outputs.ok == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .tmp
          key: warm-state-${{ github.run_id }}
          restore-keys: warm-state-

      - name: Read notices for the sample profiles
        if: steps.key.outputs.ok == 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m tools.warm_cache --out publish/extractions.json

      - name: Save extractions for tomorrow
        if: steps.key.outputs.ok == 'true' && always()
        uses: actions/cache/save@v4
        with:
          path: .tmp
          key: warm-state-${{ github.run_id }}

      - name: Publish to the cache branch (single commit, force-pushed)
        if: steps.key.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd publish
          git init -q -b cache
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extractions.json
          git commit -q -m "Refresh notice cache"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" cache
