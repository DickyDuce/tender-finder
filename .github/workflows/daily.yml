name: Daily tender alerts

on:
  workflow_dispatch:        # run manually from the Actions tab
  # To get alerts automatically every morning, add your secrets (see README) and uncomment:
  # schedule:
  #   - cron: "0 3 * * *"   # 06:00 East Africa Time

concurrency:
  group: daily-tenders
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      # State (seen tenders, cached notice extractions, alerts already sent) lives in .tmp/tenders.db.
      # Save under a new key each run; restore the most recent one.
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: .tmp
          key: tender-state-${{ github.run_id }}
          restore-keys: tender-state-

      - name: Find and send new matches
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m tools.run_daily

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .tmp
          key: tender-state-${{ github.run_id }}
